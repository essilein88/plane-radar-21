name: Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e s3touch

      - name: Merge web-flash image
        run: pio run -t merge -e s3touch

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-s3touch
          if-no-files-found: error
          path: |
            .pio/build/s3touch/firmware-merged.bin
            .pio/build/s3touch/firmware.bin
            .pio/build/s3touch/bootloader.bin
            .pio/build/s3touch/partitions.bin
